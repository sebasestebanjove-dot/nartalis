name: Import catalogo CIMA

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Importar catalogo CIMA
        run: node scripts/import-cima.mjs
        timeout-minutes: 15
